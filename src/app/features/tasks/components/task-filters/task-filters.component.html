<div class="filters-wrapper">
  <div class="search-wrapper">
    <!-- Using the standard app-input styling visually, since we don't have InputComponent imported here yet -->
    <div class="input-container">
      <span class="icon-left">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input 
        type="text" 
        class="with-icon"
        placeholder="Buscar tarefas..." 
        [value]="search"
        (input)="onSearchChange($event)"
      />
    </div>
  </div>

  <div class="filter-group" role="group" aria-label="Filtro por status">
    <button class="filter-btn" [class.active]="status === 'all'" (click)="onStatusChange('all')">Todas</button>
    <button class="filter-btn" [class.active]="status === 'pending'" (click)="onStatusChange('pending')">Pendentes</button>
    <button class="filter-btn" [class.active]="status === 'done'" (click)="onStatusChange('done')">Concluídas</button>
  </div>

  <select class="sort-select" [value]="sortBy + '-' + order" (change)="onCombinedSortChange($event)" aria-label="Ordenação">
    <option value="createdAt-desc">Mais recentes</option>
    <option value="createdAt-asc">Mais antigas</option>
    <option value="title-asc">Título A-Z</option>
    <option value="title-desc">Título Z-A</option>
  </select>

  <div class="view-toggle-group" role="group" aria-label="Alternar visualização">
    <button class="icon-button" [class.active]="viewMode === 'grid'" (click)="onViewModeChange('grid')" aria-label="Visualização em grade" title="Grade">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
    </button>
    <button class="icon-button" [class.active]="viewMode === 'table'" (click)="onViewModeChange('table')" aria-label="Visualização em lista" title="Lista">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
